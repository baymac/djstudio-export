name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Verify VERSION matches tag
        run: |
          TAG="${GITHUB_REF_NAME}"          # e.g. v0.1.7
          VERSION_FILE="$(cat VERSION)"     # e.g. 0.1.7
          if [ "v${VERSION_FILE}" != "${TAG}" ]; then
            echo "ERROR: VERSION file (${VERSION_FILE}) does not match tag (${TAG})"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build apps/course frontend
        run: |
          cd apps/course
          npm ci
          npm run build

      - name: Build vj/cats frontend
        run: |
          cd vj/cats
          npm ci
          npm run build
        continue-on-error: true  # vj/cats may not have a build script yet

      - uses: astral-sh/setup-uv@v4

      - name: Build wheel
        run: uv build --wheel

      - name: E2E smoke test — install wheel and check version
        run: |
          uv tool install --force dist/*.whl
          dj --version
          dj version
          # Smoke: help must work without copying assets or running npm
          dj --help
          dj doctor || true   # doctor may fail on CI (no DJ Studio etc); just ensure it runs

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          generate_release_notes: true
